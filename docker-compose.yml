version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: maie_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maie_db}
      POSTGRES_USER: ${POSTGRES_USER:-maie_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - maie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maie_admin} -d $${POSTGRES_DB:-maie_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maie_backend_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-maie_admin}:${POSTGRES_PASSWORD:-SecretPassword2026}@db:5432/${POSTGRES_DB:-maie_db}
      JWT_SECRET: ${JWT_SECRET:-SuperSecretJwtKey2026}
      JWT_EXPIRES_IN: 8h
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - maie-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maie_frontend_app
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_PORT: 80
    ports:
      - "80:80"
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - maie-network

volumes:
  pgdata:
    driver: local

networks:
  maie-network:
    driver: bridge
